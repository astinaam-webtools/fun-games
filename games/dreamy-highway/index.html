<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dreamy Highway Explorer - Infant 3D Sensory Experience</title>
  <style>
    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #81ecec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
    }

    /* Ambient soft vignette for cozy dreamy lighting */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      box-shadow: inset 0 0 90px rgba(255, 255, 255, 0.45), inset 0 0 160px rgba(180, 200, 255, 0.2);
      mix-blend-mode: soft-light;
    }

    /* Turbo Speed Rainbow Ribbon Overlay */
    .turbo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: radial-gradient(circle at center, transparent 35%, rgba(255, 182, 193, 0.2) 70%, rgba(112, 161, 255, 0.3) 100%);
    }

    .turbo-overlay.active {
      opacity: 1;
      animation: turboGlow 0.6s infinite alternate ease-in-out;
    }

    @keyframes turboGlow {
      0% { opacity: 0.6; }
      100% { opacity: 1.0; }
    }

    /* UI Overlay Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
      transition: opacity 0.5s ease;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 20px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.98);
      animation: floatBadge 4s ease-in-out infinite alternate;
    }

    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .brand-icon {
      font-size: 24px;
      display: inline-block;
      animation: wiggle 3s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-8deg) scale(1.1); }
      75% { transform: rotate(8deg) scale(1.1); }
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff6b81 0%, #ff7eb3 50%, #70a1ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ultrawide-badge {
      font-size: 11px;
      background: #e0f2fe;
      color: #0284c7;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.98);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      color: #57606f;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
    }

    .glass-btn:hover {
      transform: translateY(-2px) scale(1.05);
      background: rgba(255, 255, 255, 1.0);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      color: #2f3542;
    }

    .glass-btn:active {
      transform: scale(0.95);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 18px;
    }

    /* Start / Interactive Prompt Banner */
    .prompt-banner {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 16px 34px;
      border-radius: 999px;
      border: 3px solid #ffffff;
      box-shadow: 0 12px 38px rgba(100, 149, 237, 0.25);
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 8px 30px rgba(255, 182, 193, 0.4); transform: translateX(-50%) scale(1); }
      50% { box-shadow: 0 16px 45px rgba(112, 161, 255, 0.55); transform: translateX(-50%) scale(1.03); }
    }

    .prompt-banner.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(40px) scale(0.9);
      pointer-events: none;
    }

    .prompt-icon {
      font-size: 32px;
      animation: bounce 1.8s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .prompt-text {
      display: flex;
      flex-direction: column;
    }

    .prompt-title {
      font-size: 16px;
      font-weight: 800;
      color: #2f3542;
    }

    .prompt-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: #747d8c;
    }

    /* Session Progress Bar */
    .session-progress-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.35);
      z-index: 20;
    }

    .session-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 30%, #a1c4fd 70%, #c2e9fb 100%);
      transition: width 0.5s linear;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* Parent Settings Modal */
    .settings-modal {
      position: absolute;
      top: 75px;
      right: 24px;
      width: 320px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.98);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      padding: 20px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform-origin: top right;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
    }

    .settings-modal.collapsed {
      opacity: 0;
      transform: scale(0.8) translateY(-20px);
      pointer-events: none;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid #f1f2f6;
    }

    .settings-header h3 {
      font-size: 16px;
      font-weight: 800;
      color: #2f3542;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-label {
      font-size: 13px;
      font-weight: 700;
      color: #57606f;
      display: flex;
      justify-content: space-between;
    }

    .setting-control {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      border: 2px solid #e4e7eb;
      background: #f8f9fa;
      color: #747d8c;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: #70a1ff;
      border-color: #5352ed;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(112, 161, 255, 0.4);
    }

    .slider-input {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      accent-color: #ff758c;
      cursor: pointer;
    }

    /* Screen Touch Ripple Effect */
    .touch-ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: rippleExpand 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      border: 4px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      z-index: 5;
    }

    @keyframes rippleExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(3.5);
        opacity: 0;
      }
    }

    /* Floating Bubble Targets (Tap to pop) */
    .floating-screen-bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(255, 182, 193, 0.45) 60%, rgba(112, 161, 255, 0.65) 100%);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08), inset 0 0 14px rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.9);
      cursor: pointer;
      pointer-events: auto;
      animation: bubbleFloat 5s infinite ease-in-out alternate;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.2s ease;
    }

    .floating-screen-bubble:hover {
      transform: scale(1.15);
    }

    @keyframes bubbleFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-18px) rotate(12deg); }
    }
  </style>
</head>
<body>

  <!-- Top Sensory Session Progress -->
  <div class="session-progress-container">
    <div class="session-progress-bar" id="session-progress"></div>
  </div>

  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Ambient Overlays -->
  <div class="vignette-overlay"></div>
  <div class="turbo-overlay" id="turbo-overlay"></div>

  <!-- UI Overlay Layer -->
  <div class="ui-layer">
    <header class="top-bar">
      <div class="brand-badge">
        <span class="brand-icon">🌟</span>
        <span class="brand-title">Dreamy Highway</span>
        <span class="ultrawide-badge" id="aspect-badge">⚡ 21:9 Ready</span>
      </div>

      <div class="top-actions">
        <a href="../../index.html" class="glass-btn" style="text-decoration: none; color: #57606f;" title="Back to Game Hub">
          <span>🏠</span> <span>Playroom</span>
        </a>
        <button class="glass-btn icon-btn" id="btn-sound" title="Toggle Sound / Ambient Music" aria-label="Toggle Sound">
          <span id="sound-icon">🔊</span>
        </button>
        <button class="glass-btn icon-btn" id="btn-fullscreen" title="Fullscreen Mode" aria-label="Toggle Fullscreen">
          <span>⛶</span>
        </button>
        <button class="glass-btn icon-btn" id="btn-settings" title="Parent Settings" aria-label="Settings">
          <span>⚙️</span>
        </button>
      </div>
    </header>

    <!-- Bottom Interactive Prompt / Hit Helper -->
    <div class="prompt-banner" id="prompt-banner">
      <span class="prompt-icon">🎹</span>
      <div class="prompt-text">
        <span class="prompt-title">Tap Anywhere or Press Spacebar!</span>
        <span class="prompt-subtitle">Safe for baby keyboard slaps • Harmonious pentatonic chimes</span>
      </div>
    </div>
  </div>

  <!-- Parent Settings Panel -->
  <div class="settings-modal collapsed" id="settings-panel">
    <div class="settings-header">
      <h3><span>🧸</span> Parent Controls</h3>
      <button class="glass-btn icon-btn" style="width:32px; height:32px; font-size:14px;" id="btn-close-settings">✕</button>
    </div>

    <!-- Sky Time of Day -->
    <div class="setting-item">
      <div class="setting-label">
        <span>Time of Day</span>
        <span id="time-display">Day</span>
      </div>
      <div class="setting-control">
        <button class="pill-btn" data-time="cycle">Auto</button>
        <button class="pill-btn active" data-time="day">Day</button>
        <button class="pill-btn" data-time="sunset">Sunset</button>
        <button class="pill-btn" data-time="night">Night</button>
      </div>
    </div>

    <!-- Highway Cruise Speed -->
    <div class="setting-item">
      <div class="setting-label">
        <span>Highway Speed</span>
        <span id="speed-display">Gentle</span>
      </div>
      <div class="setting-control">
        <button class="pill-btn" data-speed="slow">Calm</button>
        <button class="pill-btn active" data-speed="normal">Gentle</button>
        <button class="pill-btn" data-speed="fast">Lively</button>
      </div>
    </div>

    <!-- Session Duration -->
    <div class="setting-item">
      <div class="setting-label">
        <span>Session Timer</span>
        <span id="session-display">3 Min</span>
      </div>
      <div class="setting-control">
        <button class="pill-btn" data-timer="120">2 min</button>
        <button class="pill-btn active" data-timer="180">3 min</button>
        <button class="pill-btn" data-timer="300">5 min</button>
        <button class="pill-btn" data-timer="0">Off</button>
      </div>
    </div>

    <!-- Audio Volume -->
    <div class="setting-item">
      <div class="setting-label">
        <span>Chime Volume</span>
        <span id="volume-display">70%</span>
      </div>
      <input type="range" class="slider-input" id="volume-slider" min="0" max="100" value="70">
    </div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    /* ==========================================================================
       DREAMY HIGHWAY EXPLORER - INFANT 3D SENSORY EXPERIENCE
       Tailored for 34" Ultrawide (21:9) monitors & touch devices.
       Procedural 3D assets, Web Audio API harmonic synth, and infant ergonomics.
       ========================================================================== */

    (function() {
      'use strict';

      // --- CONFIGURATION & STATE ---
      const CONFIG = {
        baseSpeed: 28,             // Base units per second
        turboSpeedMultiplier: 2.2, // Boost during baby interaction bursts
        turboDuration: 1.8,        // Seconds
        curviness: 12.0,           // Road lateral curve amplitude
        dayCycleDuration: 180,     // 3-minute full cyclical transition
        sessionDuration: 180,      // 3 minutes sensory session
      };

      const STATE = {
        speed: CONFIG.baseSpeed,
        targetSpeed: CONFIG.baseSpeed,
        turboTimer: 0,
        distanceTraveled: 0,
        dayTime: 0.35,             // Default daytime (crisp pastel cyan sky & sun)
        autoCycleDay: false,
        sessionTimer: 0,
        sessionWindDown: false,
        soundEnabled: true,
        volume: 0.7,
        activeToys: [],
        roadsideProps: [],
        floatingClouds: [],
        backgroundStars: [],
        hotAirBalloons: [],
        noteIndex: 0,
      };

      // Math road spline curves
      function getRoadX(z) {
        return Math.sin(z * 0.02) * CONFIG.curviness;
      }
      function getRoadY(z) {
        return Math.sin(z * 0.035) * 1.5;
      }

      // --- PROCEDURAL CANVASES & TEXTURE CACHING ---
      const TextureGenerator = {
        cache: new Map(),

        createCanvas(w, h) {
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          return { canvas: c, ctx: c.getContext('2d') };
        },

        // Cute smiling face with sparkling eyes and rosy blush cheeks
        createCuteFace(bgColor = '#ffd32a', type = 'happy') {
          const key = `face_${bgColor}_${type}`;
          if (this.cache.has(key)) return this.cache.get(key);

          const { canvas, ctx } = this.createCanvas(256, 256);
          
          // Solid base color fill
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, 256, 256);

          // Eyes
          ctx.fillStyle = '#2f3542';
          if (type === 'happy' || type === 'wink') {
            // Left Eye
            ctx.beginPath();
            ctx.arc(80, 110, 16, 0, Math.PI * 2);
            ctx.fill();
            // Eye Highlights
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(74, 104, 6, 0, Math.PI * 2);
            ctx.arc(86, 116, 3, 0, Math.PI * 2);
            ctx.fill();

            // Right Eye
            if (type === 'wink') {
              ctx.strokeStyle = '#2f3542';
              ctx.lineWidth = 6;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.arc(176, 115, 16, Math.PI * 0.1, Math.PI * 0.9);
              ctx.stroke();
            } else {
              ctx.fillStyle = '#2f3542';
              ctx.beginPath();
              ctx.arc(176, 110, 16, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(170, 104, 6, 0, Math.PI * 2);
              ctx.arc(182, 116, 3, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (type === 'sleepy') {
            ctx.strokeStyle = '#2f3542';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(80, 110, 18, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(176, 110, 18, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
          }

          // Rosy Blush Cheeks
          ctx.fillStyle = 'rgba(255, 105, 130, 0.65)';
          ctx.beginPath();
          ctx.ellipse(55, 140, 24, 15, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(201, 140, 24, 15, 0, 0, Math.PI * 2);
          ctx.fill();

          // Big Friendly Smile
          ctx.strokeStyle = '#2f3542';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(128, 135, 34, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();

          // Pink Tongue
          ctx.fillStyle = '#ff758c';
          ctx.beginPath();
          ctx.arc(128, 160, 14, 0, Math.PI);
          ctx.fill();

          const tex = new THREE.CanvasTexture(canvas);
          tex.encoding = THREE.sRGBEncoding;
          tex.needsUpdate = true;
          this.cache.set(key, tex);
          return tex;
        },

        // Candy swirl texture for lollipops & beach balls
        createCandySwirl(colorA = '#ff9ff3', colorB = '#feca57') {
          const key = `swirl_${colorA}_${colorB}`;
          if (this.cache.has(key)) return this.cache.get(key);

          const { canvas, ctx } = this.createCanvas(512, 512);
          const cx = 256, cy = 256;
          const numStripes = 12;
          for (let i = 0; i < numStripes; i++) {
            ctx.fillStyle = i % 2 === 0 ? colorA : colorB;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, 256, (i * 2 * Math.PI) / numStripes, ((i + 1) * 2 * Math.PI) / numStripes);
            ctx.closePath();
            ctx.fill();
          }
          const tex = new THREE.CanvasTexture(canvas);
          tex.encoding = THREE.sRGBEncoding;
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          this.cache.set(key, tex);
          return tex;
        },

        // Polka Dot Pattern
        createPolkaDots(bgColor = '#ff6b81', dotColor = '#ffffff') {
          const key = `dots_${bgColor}_${dotColor}`;
          if (this.cache.has(key)) return this.cache.get(key);

          const { canvas, ctx } = this.createCanvas(256, 256);
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, 256, 256);

          ctx.fillStyle = dotColor;
          const dots = [
            [64, 64], [192, 64], [128, 128], [64, 192], [192, 192],
            [0, 0], [256, 0], [0, 256], [256, 256], [128, 0], [128, 256], [0, 128], [256, 128]
          ];
          dots.forEach(([x, y]) => {
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();
          });
          const tex = new THREE.CanvasTexture(canvas);
          tex.encoding = THREE.sRGBEncoding;
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(2, 2);
          this.cache.set(key, tex);
          return tex;
        },

        // Procedural Road Surface Texture with glowing dashes & rainbow borders
        createRoadTexture() {
          const { canvas, ctx } = this.createCanvas(512, 1024);
          
          // Road base pastel lavender-purple
          ctx.fillStyle = '#6c5ce7';
          ctx.fillRect(0, 0, 512, 1024);

          // Rich road gradient
          const grad = ctx.createLinearGradient(0, 0, 512, 0);
          grad.addColorStop(0, '#533ec6');
          grad.addColorStop(0.12, '#6c5ce7');
          grad.addColorStop(0.5, '#7f6ef5');
          grad.addColorStop(0.88, '#6c5ce7');
          grad.addColorStop(1, '#533ec6');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 512, 1024);

          // Glowing side borders (Vibrant Golden Yellow & Coral)
          ctx.fillStyle = '#feca57';
          ctx.fillRect(16, 0, 22, 1024);
          ctx.fillRect(512 - 38, 0, 22, 1024);

          ctx.fillStyle = '#ff6b81';
          ctx.fillRect(38, 0, 12, 1024);
          ctx.fillRect(512 - 50, 0, 12, 1024);

          // Dashed Center Lines (Rounded pastel butter yellow)
          ctx.fillStyle = '#fff275';
          const dashHeight = 130;
          const gap = 90;
          for (let y = 0; y < 1024; y += dashHeight + gap) {
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(242, y + 15, 28, dashHeight, 14);
            } else {
              ctx.rect(242, y + 15, 28, dashHeight);
            }
            ctx.fill();
          }

          // Star stamps along the road edges
          ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
          for (let y = 40; y < 1024; y += 170) {
            this.drawMiniStar(ctx, 80, y, 5, 14, 7);
            this.drawMiniStar(ctx, 512 - 80, y + 85, 5, 14, 7);
          }

          const tex = new THREE.CanvasTexture(canvas);
          tex.encoding = THREE.sRGBEncoding;
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(1, 4);
          return tex;
        },

        drawMiniStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
          let rot = Math.PI / 2 * 3;
          let x = cx;
          let y = cy;
          const step = Math.PI / spikes;
          ctx.beginPath();
          ctx.moveTo(cx, cy - outerRadius);
          for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;
            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
          }
          ctx.lineTo(cx, cy - outerRadius);
          ctx.closePath();
          ctx.fill();
        }
      };

      // --- WEB AUDIO API HARMONIC SYNTHESIZER ---
      const SoundSystem = {
        ctx: null,
        masterGain: null,
        compressor: null,
        ambientPadGain: null,
        padOscillators: [],
        activeVoices: 0,
        maxPolyphony: 8,
        lastWhooshTime: 0,
        initialized: false,

        // Pentatonic Major Scale in 3 Octaves (C4 to G6)
        pentatonicScale: [
          261.63, 293.66, 329.63, 392.00, 440.00, // C4 - A4
          523.25, 587.33, 659.25, 783.99, 880.00, // C5 - A5
          1046.50, 1174.66, 1318.51, 1567.98       // C6 - G6
        ],

        padFrequencies: [130.81, 196.00, 261.63, 329.63], // C3, G3, C4, E4

        init() {
          if (this.initialized) return;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();

            // Master Limiter / Dynamics Compressor Node
            this.compressor = this.ctx.createDynamicsCompressor();
            this.compressor.threshold.setValueAtTime(-16, this.ctx.currentTime);
            this.compressor.knee.setValueAtTime(25, this.ctx.currentTime);
            this.compressor.ratio.setValueAtTime(14, this.ctx.currentTime);
            this.compressor.attack.setValueAtTime(0.004, this.ctx.currentTime);
            this.compressor.release.setValueAtTime(0.2, this.ctx.currentTime);

            // Master Gain (Respects soundEnabled state on init)
            this.masterGain = this.ctx.createGain();
            const initGain = STATE.soundEnabled ? STATE.volume : 0;
            this.masterGain.gain.setValueAtTime(initGain, this.ctx.currentTime);

            this.compressor.connect(this.masterGain);
            this.masterGain.connect(this.ctx.destination);

            this.startAmbientLullabyPad();
            this.initialized = true;
          } catch (e) {
            console.warn('AudioContext init failed:', e);
          }
        },

        resume() {
          if (!this.ctx) this.init();
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        },

        setVolume(val) {
          STATE.volume = val;
          if (this.masterGain && this.ctx) {
            const targetGain = STATE.soundEnabled ? STATE.volume : 0;
            this.masterGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.05);
          }
        },

        toggleSound() {
          STATE.soundEnabled = !STATE.soundEnabled;
          if (this.masterGain && this.ctx) {
            const targetGain = STATE.soundEnabled ? STATE.volume : 0;
            this.masterGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.05);
          }
          return STATE.soundEnabled;
        },

        // Soft ambient synthesizer drone (warm soothing lullaby)
        startAmbientLullabyPad() {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          this.ambientPadGain = this.ctx.createGain();
          this.ambientPadGain.gain.setValueAtTime(0.09, now);

          // Warm Low-pass Filter for the drone
          const padFilter = this.ctx.createBiquadFilter();
          padFilter.type = 'lowpass';
          padFilter.frequency.setValueAtTime(420, now);
          padFilter.Q.setValueAtTime(1.2, now);

          this.padFrequencies.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.detune.setValueAtTime((idx - 1.5) * 5, now);

            const voiceGain = this.ctx.createGain();
            voiceGain.gain.setValueAtTime(0.22, now);

            osc.connect(voiceGain);
            voiceGain.connect(padFilter);
            osc.start(now);
            this.padOscillators.push(osc);
          });

          padFilter.connect(this.ambientPadGain);
          this.ambientPadGain.connect(this.compressor);
        },

        // Plays a pleasant cascading chime chord from pentatonic scale
        playChimeBurst(isTurbo = false) {
          if (!this.ctx || !STATE.soundEnabled) return;
          this.resume();

          const now = this.ctx.currentTime;
          const numNotes = isTurbo ? 4 : (Math.floor(Math.random() * 2) + 2);

          for (let i = 0; i < numNotes; i++) {
            const scaleIdx = (STATE.noteIndex + i) % this.pentatonicScale.length;
            const noteFreq = this.pentatonicScale[scaleIdx];
            const noteDelay = i * 0.07;

            this.createCelestaVoice(noteFreq, now + noteDelay, isTurbo);
          }
          STATE.noteIndex = (STATE.noteIndex + 1) % this.pentatonicScale.length;

          if (isTurbo) {
            this.playWhooshSwell(now);
          }
        },

        // Celesta / Music Box chime voice with proper node disconnection
        createCelestaVoice(freq, startTime, isShimmer = false) {
          if (this.activeVoices >= this.maxPolyphony) return;
          this.activeVoices++;

          const osc1 = this.ctx.createOscillator();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, startTime);

          const osc2 = this.ctx.createOscillator();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2.004, startTime);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2600, startTime);
          filter.frequency.exponentialRampToValueAtTime(600, startTime + 1.2);

          const gainNode = this.ctx.createGain();
          gainNode.gain.setValueAtTime(0.0001, startTime);
          gainNode.gain.linearRampToValueAtTime(isShimmer ? 0.2 : 0.15, startTime + 0.025);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.5);

          osc1.connect(gainNode);
          osc2.connect(gainNode);
          gainNode.connect(filter);
          filter.connect(this.compressor);

          osc1.onended = () => {
            try {
              osc1.disconnect();
              osc2.disconnect();
              gainNode.disconnect();
              filter.disconnect();
            } catch (e) {}
            this.activeVoices = Math.max(0, this.activeVoices - 1);
          };

          osc1.start(startTime);
          osc2.start(startTime);
          osc1.stop(startTime + 1.6);
          osc2.stop(startTime + 1.6);
        },

        // Gentle bubble pop tap
        playBubblePop() {
          if (!this.ctx || !STATE.soundEnabled) return;
          this.resume();
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          const startPitch = 380 + Math.random() * 260;
          osc.frequency.setValueAtTime(startPitch, now);
          osc.frequency.exponentialRampToValueAtTime(startPitch * 1.5, now + 0.12);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.16, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

          osc.connect(gain);
          gain.connect(this.compressor);

          osc.onended = () => {
            try {
              osc.disconnect();
              gain.disconnect();
            } catch (e) {}
          };

          osc.start(now);
          osc.stop(now + 0.22);
        },

        // Soft filtered whoosh for turbo boost with cooldown throttle
        playWhooshSwell(startTime) {
          if (this.lastWhooshTime && (startTime - this.lastWhooshTime < 0.5)) return;
          this.lastWhooshTime = startTime;

          const bufferSize = Math.floor(this.ctx.sampleRate * 0.6);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const bandpass = this.ctx.createBiquadFilter();
          bandpass.type = 'bandpass';
          bandpass.frequency.setValueAtTime(320, startTime);
          bandpass.frequency.exponentialRampToValueAtTime(950, startTime + 0.3);
          bandpass.frequency.exponentialRampToValueAtTime(260, startTime + 0.6);
          bandpass.Q.setValueAtTime(2.8, startTime);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.08, startTime + 0.2);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.6);

          noise.connect(bandpass);
          bandpass.connect(gain);
          gain.connect(this.compressor);

          noise.onended = () => {
            try {
              noise.disconnect();
              bandpass.disconnect();
              gain.disconnect();
            } catch (e) {}
          };

          noise.start(startTime);
          noise.stop(startTime + 0.65);
        }
      };

      // --- THREE.JS SCENE, CAMERA & LIGHTING ---
      let scene, camera, renderer, container;
      let ambientLight, dirLight, hemisphereLight;
      let sunMesh, moonMesh, celestialPivot;
      let roadMesh, roadTexture;
      let leftHillsMesh, rightHillsMesh, groundPlaneMesh;
      let starsGroup;
      const clock = new THREE.Clock();

      function initThree() {
        container = document.getElementById('canvas-container');

        scene.background = new THREE.Color(0x81ecec);

        // Camera setup adapted for 21:9 Ultrawide monitors

        const dynamicFov = aspect > 2.0 ? 46 : (aspect > 1.6 ? 52 : 58);
        camera = new THREE.PerspectiveCamera(dynamicFov, aspect, 0.5, 700);

        container.appendChild(renderer.domElement);

        // Soft Lighting (Warm ambient + gentle directional)

        hemisphereLight = new THREE.HemisphereLight(0x81ecec, 0xa8e6cf, 0.55);

        dirLight = new THREE.DirectionalLight(0xfffbf0, 0.85);

        dirLight.shadow.camera.right = 50;

        // Event Listeners

      function updateAspectBadge(aspect) {
        const badge = document.getElementById('aspect-badge');
        if (!badge) return;
        if (aspect >= 2.2) {
          badge.textContent = '⚡ 21:9 Ultrawide';
          badge.style.background = '#e0f2fe';
          badge.style.color = '#0284c7';
        } else if (aspect >= 1.7) {
          badge.textContent = '16:9 Widescreen';
          badge.style.background = '#f1f5f9';
          badge.style.color = '#475569';
        } else {
          badge.textContent = 'Standard Screen';
          badge.style.background = '#f1f5f9';
          badge.style.color = '#475569';
        }
      }

      function onWindowResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspect = width / height;

        updateAspectBadge(aspect);

        camera.fov = aspect > 2.0 ? 46 : (aspect > 1.6 ? 52 : 58);
        camera.aspect = aspect;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      }

      // --- CELESTIAL BODIES (SMILING SUN & SMILING MOON) ---
      function buildCelestialBodies() {
        celestialPivot = new THREE.Group();
        celestialPivot.position.set(0, 0, -180);
        scene.add(celestialPivot);

        // Smiling Sun
        const sunGroup = new THREE.Group();
        const sunGeo = new THREE.SphereGeometry(15, 32, 32);
        const sunFaceTex = TextureGenerator.createCuteFace('#ffd32a', 'happy');
        const sunMat = new THREE.MeshLambertMaterial({
          color: 0xffd32a,
          map: sunFaceTex,
        });
        const sunCore = new THREE.Mesh(sunGeo, sunMat);
        sunCore.rotation.y = -Math.PI / 2;
        sunGroup.add(sunCore);

        // Sun Petal Rays
        const rayGeo = new THREE.ConeGeometry(3.2, 8.5, 16);
        const rayMat = new THREE.MeshLambertMaterial({ color: 0xffa801 });
        const numRays = 14;
        for (let i = 0; i < numRays; i++) {
          const angle = (i / numRays) * Math.PI * 2;
          const ray = new THREE.Mesh(rayGeo, rayMat);
          ray.position.set(0, Math.sin(angle) * 18.5, Math.cos(angle) * 18.5);
          ray.rotation.x = angle + Math.PI / 2;
          sunGroup.add(ray);
        }
        sunGroup.position.set(0, 52, 0);
        celestialPivot.add(sunGroup);
        sunMesh = sunGroup;

        // Smiling Crescent Moon with sleeping cap
        const moonGroup = new THREE.Group();
        const moonGeo = new THREE.SphereGeometry(14, 32, 32);
        const moonFaceTex = TextureGenerator.createCuteFace('#f5f6fa', 'sleepy');
        const moonMat = new THREE.MeshLambertMaterial({
          color: 0xf5f6fa,
          map: moonFaceTex,
        });
        const moonCore = new THREE.Mesh(moonGeo, moonMat);
        moonCore.rotation.y = -Math.PI / 2;
        moonGroup.add(moonCore);

        // Nightcap
        const capGeo = new THREE.ConeGeometry(5.5, 16, 16);
        const capMat = new THREE.MeshLambertMaterial({ color: 0xa55eea });
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.position.set(0, 13, 3.5);

        // Pompom

        const pompomMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const pompom = new THREE.Mesh(pompomGeo, pompomMat);
        pompom.position.set(0, 20, 7.5);
        moonGroup.add(pompom);

        moonGroup.position.set(0, -52, 0);
        celestialPivot.add(moonGroup);
        moonMesh = moonGroup;

      // --- TWINKLING BACKGROUND STARS ---
      function buildBackgroundStars() {
        starsGroup = new THREE.Group();
        const starCount = 140;
        const starGeo = new THREE.SphereGeometry(0.8, 8, 8);
        const starMat = new THREE.MeshBasicMaterial({ color: 0xfff200, transparent: true, opacity: 0 });

        for (let i = 0; i < starCount; i++) {
          const star = new THREE.Mesh(starGeo, starMat.clone());
          star.position.set(
            (Math.random() - 0.5) * 500,
            15 + Math.random() * 150,
            -220 - Math.random() * 80
          );
          star.userData = {
            twinkleSpeed: 2 + Math.random() * 4,
            twinkleOffset: Math.random() * Math.PI * 2,
            baseScale: 0.6 + Math.random() * 0.8
          };
          star.scale.setScalar(star.userData.baseScale);
          starsGroup.add(star);
          STATE.backgroundStars.push(star);
        }

        scene.add(starsGroup);
      }

      // --- INFINITE CURVING HIGHWAY ---
      function buildInfiniteRoad() {
        const roadWidth = 14;
        const roadLength = 360;
        const roadSegments = 180;

        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength, 16, roadSegments);
        roadGeo.rotateX(-Math.PI / 2);

        const pos = roadGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const z = pos.getZ(i);
          pos.setY(i, getRoadY(z));
          pos.setX(i, pos.getX(i) + getRoadX(z));
        }
        roadGeo.computeVertexNormals();

        roadTexture = TextureGenerator.createRoadTexture();
        const roadMat = new THREE.MeshLambertMaterial({
          map: roadTexture,
          side: THREE.DoubleSide,
        });

        roadMesh = new THREE.Mesh(roadGeo, roadMat);
        roadMesh.position.set(0, 0, -120);
        roadMesh.receiveShadow = true;
        scene.add(roadMesh);

        buildRoadCurbs(roadWidth, roadLength, roadSegments);
      }

      function buildRoadCurbs(roadWidth, roadLength, segments) {
        const curbRadius = 0.5;
        const curbGeo = new THREE.CylinderGeometry(curbRadius, curbRadius, roadLength, 10, segments);
        curbGeo.rotateX(Math.PI / 2);

        const pos = curbGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const z = pos.getZ(i);
          pos.setY(i, pos.getY(i) + getRoadY(z));
          pos.setX(i, pos.getX(i) + getRoadX(z));
        }
        curbGeo.computeVertexNormals();

        const leftCurbMat = new THREE.MeshLambertMaterial({ color: 0xff6b81 });
        const rightCurbMat = new THREE.MeshLambertMaterial({ color: 0x00d2d3 });

        const leftCurb = new THREE.Mesh(curbGeo, leftCurbMat);
        leftCurb.position.set(-roadWidth / 2 - 0.2, 0.4, -120);
        leftCurb.castShadow = true;
        scene.add(leftCurb);

        // Reusing the shared curbGeo to prevent duplicate GPU buffer allocation
        const rightCurb = new THREE.Mesh(curbGeo, rightCurbMat);
        rightCurb.position.set(roadWidth / 2 + 0.2, 0.4, -120);
        rightCurb.castShadow = true;
        scene.add(rightCurb);
      }

      // --- ROLLING PASTEL HILLS & MEADOW TERRAIN ---
      function buildRollingHills() {
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        groundGeo.rotateX(-Math.PI / 2);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0xa8e6cf });
        groundPlaneMesh = new THREE.Mesh(groundGeo, groundMat);
        groundPlaneMesh.position.set(0, -1.8, -150);
        groundPlaneMesh.receiveShadow = true;
        scene.add(groundPlaneMesh);

        const hillWidth = 180;
        const hillLength = 380;
        const hillGeo = new THREE.PlaneGeometry(hillWidth, hillLength, 32, 64);
        hillGeo.rotateX(-Math.PI / 2);

        const pos = hillGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const y = (Math.sin(x * 0.06) * 4.0 + Math.cos(z * 0.04) * 4.5 + Math.sin((x + z) * 0.03) * 3.0) + 0.5;
          pos.setY(i, y);
        }
        hillGeo.computeVertexNormals();

        const hillMatLeft = new THREE.MeshLambertMaterial({
          color: 0x6bcf95,
        });

        const hillMatRight = new THREE.MeshLambertMaterial({
          color: 0x54a0ff,
        });

        leftHillsMesh = new THREE.Mesh(hillGeo, hillMatLeft);
        leftHillsMesh.position.set(-102, -1.0, -120);
        leftHillsMesh.receiveShadow = true;
        scene.add(leftHillsMesh);

        rightHillsMesh = new THREE.Mesh(hillGeo, hillMatRight);
        rightHillsMesh.position.set(102, -1.0, -120);
        rightHillsMesh.receiveShadow = true;
        scene.add(rightHillsMesh);
      }

      // --- FLOATING PUFFY LOW-POLY CLOUDS ---
      function buildCloudSystem() {
        const cloudGroup = new THREE.Group();
        const numClouds = 28;

        for (let i = 0; i < numClouds; i++) {
          const cloud = createSinglePuffyCloud();
          cloud.position.set(
            (Math.random() - 0.5) * 220,
            24 + Math.random() * 28,
            -Math.random() * 280 + 20
          );
          cloud.userData = {
            baseSpeed: 3 + Math.random() * 4,
            bobSpeed: 1 + Math.random() * 1.5,
            bobOffset: Math.random() * Math.PI * 2,
            baseY: cloud.position.y,
            scale: 0.8 + Math.random() * 0.8
          };
          cloud.scale.setScalar(cloud.userData.scale);
          cloudGroup.add(cloud);
          STATE.floatingClouds.push(cloud);
        }

        scene.add(cloudGroup);
      }

      function createSinglePuffyCloud() {
        const group = new THREE.Group();
        const cloudMat = new THREE.MeshLambertMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.95,
        });

        const puffSizes = [
          { r: 4.8, x: 0, y: 0, z: 0 },
          { r: 4.0, x: -4.0, y: -0.5, z: 0.5 },
          { r: 3.8, x: 4.0, y: -0.4, z: -0.5 },
          { r: 3.2, x: -6.4, y: -1.2, z: 0 },
          { r: 3.4, x: 6.2, y: -1.0, z: 0 },
          { r: 3.0, x: 0, y: 2.4, z: 0.4 },
        ];

        puffSizes.forEach(p => {
          const geo = new THREE.SphereGeometry(p.r, 14, 14);
          const puff = new THREE.Mesh(geo, cloudMat);
          puff.position.set(p.x, p.y, p.z);
          group.add(puff);
        });

        return group;
      }

      // --- FLOATING HOT AIR BALLOONS ---
      function buildHotAirBalloons() {
        const balloonGroup = new THREE.Group();
        const colors = [
          ['#ff7675', '#ffeaa7'],
          ['#74b9ff', '#a29bfe'],
          ['#55efc4', '#fd79a8'],
          ['#feca57', '#ff6b81'],
        ];

        for (let i = 0; i < 4; i++) {
          const pair = colors[i % colors.length];
          const balloon = createSingleBalloon(pair[0], pair[1]);
          const side = (i % 2 === 0 ? 1 : -1);
          balloon.position.set(
            side * (48 + Math.random() * 38),
            28 + Math.random() * 20,
            -120 - i * 45
          );
          balloon.userData = {
            bobSpeed: 0.8 + Math.random() * 0.5,
            bobOffset: Math.random() * Math.PI * 2,
            baseY: balloon.position.y
          };
          balloonGroup.add(balloon);
          STATE.hotAirBalloons.push(balloon);
        }

        scene.add(balloonGroup);
      }

      function createSingleBalloon(colorA, colorB) {
        const group = new THREE.Group();

      function spawnSurpriseToy(targetX = 0) {
        // Pick an inactive toy from the pool
        const inactiveToys = toyPool.filter(t => !t.active);
        if (inactiveToys.length === 0) return;

        const toy = inactiveToys[Math.floor(Math.random() * inactiveToys.length)];
        const spawnZ = -45 - Math.random() * 15;
        const laneOffset = targetX !== 0 ? targetX : (Math.random() - 0.5) * 5;

        toy.active = true;
        toy.mesh.visible = true;
        toy.laneOffset = laneOffset;
        toy.rotSpeed = (Math.random() - 0.5) * 6;
        toy.spinAxis = Math.random() > 0.5 ? 'y' : 'z';
        toy.jumpPhase = 0;
        toy.jumpSpeed = 5 + Math.random() * 3;
        toy.jumpHeight = 2 + Math.random() * 2;
        toy.life = 0;
        toy.maxLife = 8.5;

        toy.mesh.position.set(
          getRoadX(spawnZ) + laneOffset,
          getRoadY(spawnZ) + 1.5,
          spawnZ

      // --- 3D PARTICLE BURST FOUNTAIN ---
      const PARTICLE_COUNT = 180;
      let particlePool = [];

      function initParticlePool() {
        const particleGeo = new THREE.SphereGeometry(0.38, 8, 8);
        const colors = [0xff6b81, 0xfd79a8, 0xfeca57, 0x1dd1a1, 0x74b9ff, 0xa29bfe, 0xffffff];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const color = colors[i % colors.length];
          const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0 });
          const mesh = new THREE.Mesh(particleGeo, mat);
          mesh.visible = false;
          scene.add(mesh);

          particlePool.push({
            mesh: mesh,
            active: false,
            vel: new THREE.Vector3(),
            life: 0,
            maxLife: 1.6
          });
        }
      }

      function explodeParticleBurst(originX = 0, originY = 2.5, originZ = -16, count = 45) {
        let spawned = 0;
        for (let i = 0; i < particlePool.length; i++) {
          const p = particlePool[i];
          if (!p.active) {
            p.active = true;
            p.mesh.visible = true;
            p.mesh.position.set(originX, originY, originZ);
            p.mesh.scale.setScalar(0.7 + Math.random() * 0.9);
            p.mesh.material.opacity = 1.0;

            const angleTheta = Math.random() * Math.PI * 2;
            const anglePhi = (Math.random() - 0.3) * Math.PI;
            const speed = 8 + Math.random() * 14;

            p.vel.set(
              Math.cos(angleTheta) * Math.sin(anglePhi) * speed,
              Math.abs(Math.cos(anglePhi)) * speed * 0.85 + 2.5,
              Math.sin(angleTheta) * Math.sin(anglePhi) * speed - 6
            );

            p.life = 0;
            p.maxLife = 1.2 + Math.random() * 0.8;

            spawned++;
            if (spawned >= count) break;
          }
        }
      }

      // --- USER INTERACTION TRIGGER WITH SHARED THROTTLING ---
      let lastBurstTime = 0;

      function triggerBurstInteraction(screenX = null, screenY = null) {
        const now = performance.now();
        if (now - lastBurstTime < 180) return; // 180ms cooldown gate to prevent sensory overload
        lastBurstTime = now;

        SoundSystem.resume();

        // 1. Audio Harmonic Celesta Chime
        SoundSystem.playChimeBurst(true);

        // 2. Trigger Turbo Rainbow Highway Rush
        STATE.turboTimer = CONFIG.turboDuration;
        STATE.targetSpeed = CONFIG.baseSpeed * CONFIG.turboSpeedMultiplier;

        const turboOverlay = document.getElementById('turbo-overlay');
        if (turboOverlay) {
          turboOverlay.classList.add('active');
          setTimeout(() => turboOverlay.classList.remove('active'), CONFIG.turboDuration * 1000);
        }

        // 3. Particle Burst Screen Origin
        let worldX = 0, worldY = 2.5, worldZ = -18;
        if (screenX !== null && screenY !== null) {
          const normX = (screenX / window.innerWidth) * 2 - 1;
          worldX = normX * 8;
          createScreenRipple(screenX, screenY);
        }

        // 4. Particle Burst Fountain
        explodeParticleBurst(worldX, worldY, worldZ, 45);

        // 5. Spawn 3D Surprise Toy
        spawnSurpriseToy(worldX * 0.6);

        // 6. Hide Initial Start Prompt Banner
        const promptBanner = document.getElementById('prompt-banner');
        if (promptBanner && !promptBanner.classList.contains('hidden')) {
          promptBanner.classList.add('hidden');
        }
      }

      // Visual Touch Ripple
      function createScreenRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'touch-ripple';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        const colors = ['#ffeaa7', '#ff7675', '#74b9ff', '#55efc4', '#a29bfe'];
        ripple.style.borderColor = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 850);
      }

      // --- USER EVENT HANDLERS ---
      function setupInteractions() {
        // TV Remote & Keyboard mash listener
        window.addEventListener('keydown', (e) => {
          if (e.repeat) return; // Prevent key-repeat flood

          const code = e.keyCode || e.which;
          const key = e.key;

          // TV Remote Back / Return button handler (Tizen: 10009, webOS: 461, Android: 4, Escape)
          const isBackButton = key === 'Escape' || key === 'Back' || key === 'GoBack' || key === 'BrowserBack' || code === 10009 || code === 461 || code === 4;
          if (isBackButton) {
            e.preventDefault();
            window.location.href = '../../index.html';
            return;
          }

          // If typing in an input inside settings modal, don't trigger burst
          if (e.target && e.target.tagName === 'INPUT') return;

          // Prevent default for TV navigation/action keys to avoid browser scrolling or unwanted clicks
          const tvActionKeys = [' ', 'Space', 'Enter', 'Select', 'Accept', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown'];
          if (tvActionKeys.includes(key) || [13, 23, 32, 33, 34, 37, 38, 39, 40].includes(code)) {
            e.preventDefault();
          }

          // If a button has focus, blur it so TV remote OK/Select doesn't trigger unwanted button clicks
          if (document.activeElement && document.activeElement !== document.body) {
            document.activeElement.blur();
          }

          // Trigger in-game sensory burst on ANY TV remote button or keypress
          triggerBurstInteraction();
        }, false);

        // Touch & Pointer listener
        container.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (document.activeElement && document.activeElement !== document.body) {
            document.activeElement.blur();
          }
          triggerBurstInteraction(e.clientX, e.clientY);
        }, false);

        // UI Controls
        const btnSound = document.getElementById('btn-sound');
        const soundIcon = document.getElementById('sound-icon');
        btnSound.addEventListener('click', (e) => {
          e.stopPropagation();
          btnSound.blur();
          const isEnabled = SoundSystem.toggleSound();
          soundIcon.textContent = isEnabled ? '🔊' : '🔇';
        });

        const btnFullscreen = document.getElementById('btn-fullscreen');
        btnFullscreen.addEventListener('click', (e) => {
          e.stopPropagation();
          btnFullscreen.blur();
          const docEl = document.documentElement;
          const isFull = document.fullscreenElement || document.webkitFullscreenElement;
          if (!isFull) {
            const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
            if (req) req.call(docEl).catch(() => {});
          } else {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) exit.call(document).catch(() => {});
          }
        });

        // Parent Settings Panel
        const btnSettings = document.getElementById('btn-settings');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        const settingsPanel = document.getElementById('settings-panel');

        btnSettings.addEventListener('click', (e) => {
          e.stopPropagation();
          btnSettings.blur();
          settingsPanel.classList.toggle('collapsed');
        });

        btnCloseSettings.addEventListener('click', (e) => {
          e.stopPropagation();
          btnCloseSettings.blur();
          settingsPanel.classList.add('collapsed');
        });

        // Time of Day buttons
        document.querySelectorAll('[data-time]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            btn.blur();
            document.querySelectorAll('[data-time]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mode = btn.getAttribute('data-time');
            if (mode === 'cycle') {
              STATE.autoCycleDay = true;
              document.getElementById('time-display').textContent = 'Auto';
            } else if (mode === 'day') {
              STATE.autoCycleDay = false;
              STATE.dayTime = 0.35;
              document.getElementById('time-display').textContent = 'Day';
            } else if (mode === 'sunset') {
              STATE.autoCycleDay = false;
              STATE.dayTime = 0.65;
              document.getElementById('time-display').textContent = 'Sunset';
            } else if (mode === 'night') {
              STATE.autoCycleDay = false;
              STATE.dayTime = 0.88;
              document.getElementById('time-display').textContent = 'Night';
            }
          });
        });

        // Highway Speed buttons
        document.querySelectorAll('[data-speed]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            btn.blur();
            document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const spd = btn.getAttribute('data-speed');
            if (spd === 'slow') CONFIG.baseSpeed = 16;
            else if (spd === 'normal') CONFIG.baseSpeed = 28;
            else if (spd === 'fast') CONFIG.baseSpeed = 42;
            STATE.targetSpeed = CONFIG.baseSpeed;
            document.getElementById('speed-display').textContent = btn.textContent;
          });
        });

        // Session Duration buttons
        document.querySelectorAll('[data-timer]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            btn.blur();
            document.querySelectorAll('[data-timer]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const dur = parseInt(btn.getAttribute('data-timer'), 10);
            CONFIG.sessionDuration = dur;
            STATE.sessionTimer = 0;
            STATE.sessionWindDown = false;
            document.getElementById('session-display').textContent = btn.textContent;
            const bar = document.getElementById('session-progress');
            if (bar && dur === 0) bar.style.width = '0%';
          });
        });

        // Volume Slider
        const volumeSlider = document.getElementById('volume-slider');
        volumeSlider.addEventListener('input', (e) => {
          const val = parseInt(e.target.value, 10) / 100;
          SoundSystem.setVolume(val);
          document.getElementById('volume-display').textContent = Math.round(val * 100) + '%';
        });
      }

      // --- ATMOSPHERE & DAY/NIGHT SKY CYCLE ---
      function updateAtmosphere(delta, elapsedTime) {
        if (STATE.autoCycleDay) {
          STATE.dayTime = (STATE.dayTime + (delta / CONFIG.dayCycleDuration)) % 1.0;
        }

        const t = STATE.dayTime;
        let skyColor = new THREE.Color();
        let fogColor = new THREE.Color();
        let lightColor = new THREE.Color();
        let lightIntensity = 0.85;
        let nightFactor = 0;

        if (t < 0.25) {
          // Sunrise / Dawn (Peach & Lilac)
          const p = t / 0.25;
          skyColor.lerpColors(new THREE.Color(0xffd1dc), new THREE.Color(0x81ecec), p);
          fogColor.copy(skyColor);
          lightColor.lerpColors(new THREE.Color(0xffb8b8), new THREE.Color(0xfffbe0), p);
          lightIntensity = 0.75 + p * 0.15;
        } else if (t < 0.5) {
          // Daylight (Crisp Sky Cyan & Sunshine)
          const p = (t - 0.25) / 0.25;
          skyColor.lerpColors(new THREE.Color(0x81ecec), new THREE.Color(0x74b9ff), p * 0.4);
          fogColor.copy(skyColor);
          lightColor.setHex(0xfffbf0);
          lightIntensity = 0.9;
        } else if (t < 0.75) {
          // Sunset / Twilight (Coral, Pink & Lavender)
          const p = (t - 0.5) / 0.25;
          skyColor.lerpColors(new THREE.Color(0x81ecec), new THREE.Color(0xff7675), p * 0.75);
          skyColor.lerp(new THREE.Color(0xa29bfe), p * 0.6);
          fogColor.copy(skyColor);
          lightColor.lerpColors(new THREE.Color(0xfffbe0), new THREE.Color(0xff9f43), p);
          lightIntensity = 0.85 - p * 0.3;
        } else {
          // Dreamy Starry Night (Deep Indigo & Soft Violet)
          const p = (t - 0.75) / 0.25;
          skyColor.lerpColors(new THREE.Color(0x382d8c), new THREE.Color(0x1a1548), p);
          fogColor.copy(skyColor);
          lightColor.lerpColors(new THREE.Color(0xa29bfe), new THREE.Color(0x70a1ff), p);
          lightIntensity = 0.55;
          nightFactor = 1.0;
        }

        scene.background.copy(skyColor);
        scene.fog.color.copy(fogColor);
        dirLight.color.copy(lightColor);
        dirLight.intensity = lightIntensity;

        // Rotate celestial pivot
        if (celestialPivot) {
          celestialPivot.rotation.x = (t - 0.25) * Math.PI * 2;
        }

        // Twinkle stars in night sky
        for (let i = 0; i < STATE.backgroundStars.length; i++) {
          const star = STATE.backgroundStars[i];
          if (nightFactor > 0.05) {
            const twinkle = (Math.sin(elapsedTime * star.userData.twinkleSpeed + star.userData.twinkleOffset) + 1) * 0.5;
            star.material.opacity = nightFactor * (0.3 + twinkle * 0.7);
          } else {
            star.material.opacity = 0;
          }
        }
      }

      // --- SESSION TIMER PROGRESS & SOOTHING WIND-DOWN ---
      function updateSessionTimer(delta) {
        if (CONFIG.sessionDuration > 0) {
          STATE.sessionTimer += delta;
          const progress = Math.min(STATE.sessionTimer / CONFIG.sessionDuration, 1.0);
          const bar = document.getElementById('session-progress');
          if (bar) bar.style.width = (progress * 100) + '%';

          // Calming lullaby wind-down upon completing duration
          if (progress >= 1.0 && !STATE.sessionWindDown) {
            STATE.sessionWindDown = true;
            STATE.autoCycleDay = false;
            STATE.dayTime = 0.88; // Starry nighttime
            CONFIG.baseSpeed = 14; // Calm cruise
            STATE.targetSpeed = 14;
          }
        }
      }

      // --- MAIN ANIMATION & SIMULATION LOOP ---
      function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.1);
        const elapsedTime = clock.getElapsedTime();

        // 1. Smooth Turbo Speed Easing & Cruise Motion
        if (STATE.turboTimer > 0) {
          STATE.turboTimer -= delta;
          if (STATE.turboTimer <= 0) {
            STATE.targetSpeed = CONFIG.baseSpeed;
          }
        }
        STATE.speed += (STATE.targetSpeed - STATE.speed) * (delta * 3.5);
        const moveDist = STATE.speed * delta;
        STATE.distanceTraveled += moveDist;

        // 2. Texture & Road Scroll
        if (roadTexture) {
          roadTexture.offset.y = (roadTexture.offset.y - (moveDist * 0.035)) % 1.0;
          if (STATE.turboTimer > 0) {
            roadMesh.material.color.setHSL((elapsedTime * 0.5) % 1.0, 0.65, 0.95);
          } else {
            roadMesh.material.color.setHex(0xffffff);
          }
        }

        // 3. Update Roadside Props along curved highway
        for (let i = 0; i < STATE.roadsideProps.length; i++) {
          const prop = STATE.roadsideProps[i];
          prop.position.z += moveDist;

          const currentRoadX = getRoadX(prop.position.z);
          const currentRoadY = getRoadY(prop.position.z);
          
          prop.position.x = currentRoadX + (prop.userData.side * prop.userData.lateralDist);
          prop.position.y = currentRoadY;

          // Wobble & Spin
          prop.rotation.y = Math.sin(elapsedTime * prop.userData.wobbleSpeed + prop.userData.wobbleOffset) * 0.2;
          if (prop.userData.bladePivot) {
            prop.userData.bladePivot.rotation.z += delta * (STATE.speed * 0.15);
          }

          // Recycle prop when behind camera
          if (prop.position.z > 16) {
            prop.position.z -= 320;
            prop.userData.side = (Math.random() > 0.5 ? 1 : -1);
            prop.userData.lateralDist = 11 + Math.random() * 18;
            prop.position.x = getRoadX(prop.position.z) + (prop.userData.side * prop.userData.lateralDist);
            prop.position.y = getRoadY(prop.position.z);
          }
        }

        // 4. Update Floating Clouds
        for (let i = 0; i < STATE.floatingClouds.length; i++) {
          const cloud = STATE.floatingClouds[i];
          cloud.position.z += (STATE.speed * 0.25 + cloud.userData.baseSpeed) * delta;
          cloud.position.y = cloud.userData.baseY + Math.sin(elapsedTime * cloud.userData.bobSpeed + cloud.userData.bobOffset) * 1.5;

          if (cloud.position.z > 30) {
            cloud.position.z = -260;
            cloud.position.x = (Math.random() - 0.5) * 220;
          }
        }

        // 5. Update Hot Air Balloons
        for (let i = 0; i < STATE.hotAirBalloons.length; i++) {
          const balloon = STATE.hotAirBalloons[i];
          balloon.position.y = balloon.userData.baseY + Math.sin(elapsedTime * balloon.userData.bobSpeed + balloon.userData.bobOffset) * 2;
          balloon.rotation.y = Math.sin(elapsedTime * 0.5 + balloon.userData.bobOffset) * 0.15;
        }

        // 6. Update Active 3D Surprise Toys (Zero-Allocation Pool)
        for (let i = 0; i < toyPool.length; i++) {
          const toy = toyPool[i];
          if (toy.active) {
            toy.mesh.position.z += (STATE.speed * 0.8) * delta;
            toy.life += delta;

            // Road curve tracking
            toy.mesh.position.x = getRoadX(toy.mesh.position.z) + toy.laneOffset;

            // Jump & Spin
            toy.jumpPhase += delta * toy.jumpSpeed;
            toy.mesh.position.y = getRoadY(toy.mesh.position.z) + 1.5 + Math.abs(Math.sin(toy.jumpPhase)) * toy.jumpHeight;

            if (toy.spinAxis === 'y') {
              toy.mesh.rotation.y += toy.rotSpeed * delta;
            } else {
              toy.mesh.rotation.z += toy.rotSpeed * delta;
            }

            // Return to pool when past camera or expired
            if (toy.mesh.position.z > 18 || toy.life > toy.maxLife) {
              toy.active = false;
              toy.mesh.visible = false;
            }
          }
        }

        // 7. Update 3D Particles
        for (let i = 0; i < particlePool.length; i++) {
          const p = particlePool[i];
          if (p.active) {
            p.life += delta;
            if (p.life >= p.maxLife) {
              p.active = false;
              p.mesh.visible = false;
            } else {
              p.vel.y -= 9.8 * delta * 0.4;
              p.mesh.position.addScaledVector(p.vel, delta);
              p.mesh.material.opacity = Math.max(0, 1.0 - (p.life / p.maxLife));
            }
          }
        }

        // 8. Gentle Camera Breathing Motion & Horizon Road Tracking
        camera.position.x = Math.sin(elapsedTime * 0.4) * 0.5;
        camera.position.y = 4.6 + Math.sin(elapsedTime * 0.6) * 0.25;

        const lookZ = -45;
        camera.lookAt(getRoadX(lookZ) * 0.35, 3.0 + getRoadY(lookZ) * 0.5, lookZ);

        // 9. Update Day/Night Atmosphere & Session Timer
        updateAtmosphere(delta, elapsedTime);
        updateSessionTimer(delta);

        // 10. TV Remote / Gamepad API Polling
        if (navigator.getGamepads) {
          const gamepads = navigator.getGamepads();
          for (let g = 0; g < gamepads.length; g++) {
            const gp = gamepads[g];
            if (gp) {
              // Any button pressed on TV remote / gamepad triggers sensory burst
              for (let b = 0; b < gp.buttons.length; b++) {
                if (gp.buttons[b].pressed) {
                  if (b === 1) { // B / Back button returns to hub
                    window.location.href = '../../index.html';
                  } else {
                    triggerBurstInteraction();
                  }
                  break;
                }
              }
            }
          }
        }

        // Render Scene
        renderer.render(scene, camera);
      }

      // Initialize on DOM Ready
      window.addEventListener('DOMContentLoaded', () => {
        initThree();
        animate();
      });

    })();
  </script>
</body>
